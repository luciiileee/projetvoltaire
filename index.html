<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Graphie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout : carnet de correction. Bandeau encre indigo, papier légèrement bleuté, phrases en serif de lecture, verdicts sarcelle (juste) et brique (faux), point safran comme signature. Thème clair unique, choisi volontairement. */
:root{
  color-scheme:light;
  --bar:#1E2348; --bar-ink:#F4F5FB; --bg:#F7F8FC; --ink:#1A1D33; --muted:#5D6280; --line:#DCDFEC;
  --lime:#0E7C66; --lime-ink:#FFFFFF; --lime-soft:#D5EFE8; --lime-text:#0E7C66;
  --orange:#C2492F; --orange-soft:#F7DDD5; --red:#C2492F;
  --tile:#FFFFFF; --blue:#3E44B8; --brand:#3E44B8; --brand-soft:#E4E6FA; --saffron:#F0B23E;
  --f:"Manrope", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bar)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.w:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}

/* barre noire */
.topbar{background:var(--bar);color:var(--bar-ink);position:sticky;top:env(safe-area-inset-top, 0px);z-index:5}
.tb{display:flex;align-items:center;gap:14px;min-height:60px;padding-block:8px}
.mark{font-weight:600;font-style:italic;font-size:22px;letter-spacing:.01em;white-space:nowrap}
.mark b{color:var(--lime);font-style:normal}
.lvwrap{display:flex;flex-direction:column;gap:5px;min-width:0;flex:0 1 190px}
.lvwrap span{font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.lvbar{height:5px;background:#FFFFFF;border-radius:3px;overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--lime)}
.stars{flex:1;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 5px;max-width:300px;margin:0 auto;font-size:17px;line-height:1;color:#7A7A78}
.stars i{font-style:normal}
.stars i.on{color:var(--lime)}
.exit{border:1.5px solid #FFFFFF;background:transparent;color:#FFFFFF;padding:8px 14px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;font-size:14px;border-radius:2px;white-space:nowrap}
.sync{margin-left:auto;font-size:12.5px;display:flex;align-items:center;gap:6px;color:#D6D6D6}
.sync i{width:8px;height:8px;border-radius:50%;background:#8A8A88;display:inline-block}
.sync.cloud i{background:var(--lime)}

/* bandeau de verdict */
.banner{text-align:center;padding-block:14px}
.banner strong{display:block;font-size:40px;line-height:1.05;font-weight:500;text-transform:uppercase;letter-spacing:.02em;color:#FFFFFF}
.banner span{display:block;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:#FFFFFF;margin-top:4px}
.banner.ok{background:var(--lime)}
.banner.bad{background:var(--orange)}
.banner.neutral{padding-block:18px 6px}
.banner.neutral p{margin:0;color:var(--ink);font-size:16.5px}

/* zone d'exercice */
.ex{display:flex;flex-direction:column;gap:20px;padding-block:22px 8px}
.sent{font-size:34px;font-weight:300;line-height:1.5;margin:0}
.w{display:inline;cursor:pointer;border-radius:999px;padding:0 2px;-webkit-tap-highlight-color:transparent}
.w:hover{background:#F0F0F0}
.answered .w{cursor:default}.answered .w:hover{background:none}
.w.err{text-decoration:underline wavy var(--red);text-decoration-thickness:2px;text-underline-offset:9px}
.w.hit-ok{background:rgba(163,213,28,.45)}
.w.hit-bad{background:rgba(247,147,30,.38)}
.nofault{align-self:center;background:var(--lime);color:var(--lime-ink);border:none;padding:16px 28px;font-weight:500;font-size:19px;letter-spacing:.04em;text-transform:uppercase;border-radius:2px;margin-top:6px}
.rulehead{display:flex;align-items:center;gap:14px}
.rulehead h3{margin:0;font-size:22px;font-weight:600;line-height:1.25}
.rulehead::after{content:"";flex:1;min-width:40px;height:1px;background:var(--line)}
.ruletxt{margin:0;font-size:18px;color:var(--ink);font-weight:400;max-width:70ch}
.sep{height:1px;background:var(--line);border:0;margin:4px 0}
.correct-lab{color:var(--lime-text);font-size:28px;font-weight:300;margin:0}
.correct{font-size:20px;margin:0}
.correct b{color:var(--lime-text);font-weight:600}
.trap{font-size:16px;color:var(--muted);margin:0}
.anchor{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.anchor i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--lime-text);display:inline-block}
.anchor i.on{background:var(--lime)}
.nextrow{display:flex;justify-content:flex-end;align-items:center;gap:16px;position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom, 0px))}
.nextbtn{background:var(--lime);color:var(--lime-ink);border:none;padding:20px 34px;font-size:21px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;border-radius:2px}

/* vocabulaire et QCM */
.word{text-align:center;font-size:26px;font-weight:600;margin:6px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:760px;margin:0 auto;width:100%}
.grid.list{grid-template-columns:1fr}
.tile{background:var(--tile);color:var(--blue);border:none;min-height:96px;padding:14px;font-size:21px;font-weight:300;line-height:1.3;text-align:center;border-radius:0}
.grid.list .tile{min-height:0;text-align:left;font-size:19px;padding:16px 18px}
.tile:hover{background:#E8E8E8}
.answered .tile{cursor:default}
.tile.ok{background:var(--lime)}
.tile.bad{background:var(--orange-soft)}
.tile.idle-lit{background:var(--lime-soft)}
.example{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center;max-width:760px;margin:0 auto;width:100%}
.book{grid-row:1/3;width:58px;height:58px;border-radius:50%;background:var(--bar);display:grid;place-items:center}
.example h4{margin:0;font-size:22px;font-weight:600}
.example p{margin:0;font-size:18.5px;font-weight:400}
.example .def{color:var(--muted);font-size:16px}

/* pages */
.page{display:flex;flex-direction:column;gap:16px;padding-block:20px}
.lede{margin:0;color:var(--muted);max-width:62ch}
.mod{border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;border-radius:2px}
.mod-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.mod h2{margin:0;font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.mod .lvl{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.05em}
.mod .kick{color:var(--muted);margin:0}
.bar{height:6px;background:var(--tile);overflow:hidden}
.bar span{display:block;height:100%;background:var(--lime)}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:var(--bg);padding:11px 16px;font-weight:500;font-size:15px;letter-spacing:.03em;text-transform:uppercase;border-radius:2px}
.btn.pri{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.linkbtn{background:none;border:none;color:var(--blue);font-weight:500;padding:4px 0}
.head{display:flex;align-items:center;gap:12px}
.back{border:1.5px solid var(--ink);background:var(--bg);width:40px;height:40px;font-size:18px;flex:none;border-radius:2px}
.head h1{margin:0;font-size:24px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.head .sub{font-size:14px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:8px 0 0;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:var(--tile);border:none;padding:12px 14px;text-align:left;width:100%}
.lv:hover{background:#E8E8E8}
.lv .n{font-size:24px;font-weight:300;width:30px;text-align:center;font-variant-numeric:tabular-nums}
.lv .t{min-width:0}
.lv .t div{font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:15px}
.lv .t small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.lv .mini{display:block;height:4px;background:#FFFFFF;margin-top:6px;overflow:hidden}
.lv .mini span{display:block;height:100%;background:var(--lime)}
.chip{font-size:12.5px;font-weight:500;padding:3px 9px;white-space:nowrap;font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.04em}
.chip.done{background:var(--lime);color:var(--lime-ink)}
.chip.go{background:#FFFFFF;color:var(--ink)}
.chip.new{color:var(--muted)}
.rl{display:flex;flex-direction:column;gap:6px}
.ri{border:1px solid var(--line);padding:10px 14px}
.ri summary{cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
.ri summary::-webkit-details-marker{display:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1.5px solid var(--muted)}
.dot.m{background:var(--lime);border-color:var(--lime)}
.dot.e{background:var(--orange);border-color:var(--orange)}
.ri summary span{flex:1;min-width:0;font-weight:500}
.ri summary small{color:var(--muted);font-variant-numeric:tabular-nums}
.ri p{margin:8px 0 0}
.ri .exs{color:var(--muted);margin-top:6px;font-style:italic}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1.5px solid var(--line);background:var(--bg);padding:5px 12px;font-size:14px}
.filters button.on{background:var(--bar);color:#FFFFFF;border-color:var(--bar)}
.box{border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:18px;font-weight:600}
.box p{margin:0;color:var(--muted)}
textarea{width:100%;min-height:90px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);padding:10px;background:var(--tile);color:var(--ink);resize:vertical;word-break:break-all}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.msg{font-size:14px;font-weight:500}
.msg.ok{color:var(--lime-text)}.msg.bad{color:var(--red)}
.big{font-size:30px;font-weight:500;margin:0;text-transform:uppercase}
.foot{font-size:13px;color:var(--muted);text-align:center}

.mem{border:2px solid var(--orange);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.mem b{font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.mem span{color:var(--muted)}
.mem.calm{border-color:var(--lime)}
.tag{display:inline-block;background:var(--orange-soft);color:var(--ink);padding:6px 12px;font-size:15px;font-weight:500}
.trk{margin:14px 0 0;font-size:22px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;border-bottom:3px solid var(--lime);padding-bottom:4px}
.grp{display:flex;flex-direction:column;gap:8px}
.grph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--tile);padding:12px 14px}
.gt{display:flex;flex-direction:column;min-width:0}
.gt .nm{font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.gt .sb{color:var(--muted)}
.hint{text-align:center;color:var(--muted);margin:0;font-size:16px}
.tl{position:relative;padding-left:26px;display:flex;flex-direction:column}
.tl::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:#D0D0D0}
.tli{position:relative;display:flex;align-items:center;gap:14px;min-height:96px;padding:12px 16px 12px 22px;border:none;border-bottom:1px solid var(--line);background:var(--bg);text-align:left;width:100%;color:var(--ink)}
.tli::before{content:"";position:absolute;left:-25px;top:50%;width:14px;height:14px;border-radius:50%;background:#C8C8C8;transform:translateY(-50%)}
.tli .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.tli .nm{font-size:22px;font-weight:500;text-transform:uppercase;letter-spacing:.02em}
.tli .sb{font-size:18px;font-weight:300}
.tli .pctv{font-size:22px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.circ{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none}
.tli.locked{color:#B9B9B9;cursor:not-allowed}
.tli.locked .circ{background:#C8C8C8}
.tli.open .circ{border:2px solid var(--orange);color:var(--orange)}
.tli.open:hover,.tli.done:hover{background:#FAFAFA}
.tli.done .circ{background:var(--lime)}
.tli.done::before{background:var(--lime)}
.tli.cur{background:var(--orange);color:#FFFFFF;border-bottom-color:transparent;border-radius:0 70px 70px 0;margin-left:14px;width:calc(100% - 14px)}
.tli.cur::before{background:var(--orange);left:-39px}
.tli.cur::after{content:"";position:absolute;left:-30px;top:0;bottom:0;width:31px;background:var(--orange);clip-path:polygon(100% 0,100% 100%,0 50%)}
.tli.cur .circ{background:#FFFFFF;color:var(--orange)}
.withbottom{padding-bottom:110px}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:#FFFFFF;z-index:6;padding-bottom:env(safe-area-inset-bottom, 0px)}
.bb{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.tt{display:flex;flex-direction:column;align-items:center;color:var(--lime);text-transform:uppercase;font-weight:600;letter-spacing:.03em;line-height:1.15}
.tt b{text-transform:none}
@media (max-width:640px){
  .tli .nm{font-size:18px}.tli .sb{font-size:15px}.tli .pctv{font-size:17px}.circ{width:44px;height:44px}.tli{min-height:82px;gap:10px;padding-right:10px}
  .mark{display:none}
  .tb{gap:10px}
  .lvwrap{flex-basis:110px}
  .stars{font-size:13px;gap:1px 3px}
  .exit{padding:7px 10px;font-size:13px}
  .banner strong{font-size:30px}
  .banner span{font-size:14px}
  .sent{font-size:25px}
  .tile{font-size:17px;min-height:84px;padding:10px}
  .grid.list .tile{font-size:17px}
  .word{font-size:23px}
  .rulehead h3{font-size:19px}
  .ruletxt,.example p{font-size:16.5px}
  .correct-lab{font-size:23px}
  .correct{font-size:18px}
  .nextbtn{padding:15px 26px;font-size:18px}
  .book{width:46px;height:46px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===== Identité Graphie ===== */
.mark{font-style:normal;font-weight:800;letter-spacing:-.01em}
.mark b{color:var(--saffron)}
.topbar{box-shadow:0 1px 0 rgba(255,255,255,.06)}
.lvwrap span{text-transform:none;letter-spacing:0;font-weight:600}
.lvbar{background:rgba(255,255,255,.18);height:6px;border-radius:99px}
.lvbar i{background:var(--saffron);border-radius:99px}
.stars{gap:5px;max-width:260px}
.stars i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22);display:inline-block}
.stars i.on{background:var(--saffron)}
.exit{border-radius:99px;text-transform:none;letter-spacing:0;border-color:rgba(255,255,255,.5);font-weight:600}
.banner{padding-block:16px}
.banner strong{text-transform:none;font-size:30px;font-weight:800;letter-spacing:-.01em}
.banner span{text-transform:none;letter-spacing:0;font-size:16px;opacity:.95}
.banner.ok strong::before{content:"✓  "}
.banner.bad strong::before{content:"✗  "}
.banner.neutral{padding-block:16px 4px}
.sent{font-family:var(--f-read);font-weight:400;font-size:31px;line-height:1.6}
.w{border-radius:6px}
.w:hover{background:var(--brand-soft)}
.w.err{text-decoration-color:var(--red)}
.w.hit-ok{background:var(--lime-soft)}
.w.hit-bad{background:var(--orange-soft)}
.nofault{background:var(--brand);color:#FFFFFF;text-transform:none;letter-spacing:0;font-weight:700;border-radius:12px}
.rulehead h3{font-weight:700}
.ruletxt{font-size:17px}
.correct-lab{font-weight:600;font-size:22px}
.correct{font-family:var(--f-read);font-size:20px}
.nextrow{background:var(--bg)}
.nextbtn{background:var(--brand);color:#FFFFFF;text-transform:none;letter-spacing:0;font-weight:700;border-radius:12px;padding:16px 34px}
.word{font-family:var(--f-read);font-weight:600;font-size:30px}
.tile{background:var(--tile);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;font-weight:500;font-size:18px}
.tile:hover{background:var(--brand-soft);border-color:var(--brand)}
.tile.ok{background:var(--lime);border-color:var(--lime);color:#FFFFFF}
.tile.bad{background:var(--orange-soft);border-color:var(--orange)}
.book{background:var(--brand)}
.example p{font-family:var(--f-read)}
.mod{background:var(--tile);border-radius:14px;border-color:var(--line)}
.mod h2{text-transform:none;letter-spacing:-.01em;font-weight:800}
.mod .lvl{text-transform:none;letter-spacing:0}
.bar{border-radius:99px;background:var(--brand-soft)}
.bar span{background:var(--brand);border-radius:99px}
.btn{border-radius:10px;text-transform:none;letter-spacing:0;font-weight:700;border-color:var(--line);background:var(--tile)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#FFFFFF}
.head h1{text-transform:none;letter-spacing:-.01em;font-weight:800}
.back{border-radius:10px;border-color:var(--line);background:var(--tile)}
.filters button{border-radius:99px}
.filters button.on{background:var(--brand);border-color:var(--brand)}
.tl::before{background:var(--line)}
.tli{background:transparent;border-radius:12px;border-bottom:1px solid var(--line)}
.tli .nm{text-transform:none;letter-spacing:0;font-weight:700;font-size:20px}
.tli .sb{font-weight:400}
.tli.locked{color:#A7ABC2}
.tli.locked .circ{background:#E1E3EE}
.tli.locked .circ svg{fill:#A7ABC2}
.tli.open .circ{border-color:var(--brand);color:var(--brand)}
.tli.done .circ{background:var(--lime)}
.tli.done .circ svg{stroke:#FFFFFF}
.tli.done::before{background:var(--lime)}
.tli.cur{background:var(--brand);border-radius:14px;margin-left:0;width:100%;border-bottom-color:transparent}
.tli.cur::before{background:var(--brand);left:-25px;box-shadow:0 0 0 4px var(--brand-soft)}
.tli.cur::after{display:none}
.tli.cur .circ{background:var(--saffron);color:var(--bar)}
.chip.done{border-radius:99px}
.tt{color:var(--saffron)}
.mem{border:none;background:var(--brand-soft);border-radius:14px}
.mem b{text-transform:none;letter-spacing:0;font-weight:800}
.mem.calm{background:var(--lime-soft)}
.tag{border-radius:8px}
.trk{text-transform:none;letter-spacing:-.01em;border-bottom-color:var(--brand)}
.grph{border-radius:12px;background:var(--brand-soft)}
.gt .nm{text-transform:none;letter-spacing:0}
.ri{border-radius:10px;background:var(--tile)}
.box{border-radius:14px;background:var(--tile)}
.big{text-transform:none}
.adv{display:flex;align-items:center;gap:10px;align-self:center;background:var(--tile);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:15px;max-width:520px}
.adv input{position:absolute;opacity:0;width:1px;height:1px}
.adv .sw{flex:none;width:40px;height:24px;border-radius:99px;background:#C9CCDD;position:relative;transition:background .15s}
.adv .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#FFFFFF;transition:transform .15s}
.adv input:checked+.sw{background:var(--brand)}
.adv input:checked+.sw::after{transform:translateX(16px)}
.adv input:focus-visible+.sw{outline:3px solid var(--blue);outline-offset:2px}
.adv b{color:var(--brand)}
.w.picked{background:var(--brand-soft);outline:2px solid var(--brand)}
.fixbox{display:flex;flex-direction:column;gap:10px;background:var(--tile);border:1.5px solid var(--brand);border-radius:14px;padding:16px}
.fixbox label{font-size:17px}
.fixbox input{font-family:var(--f-read);font-size:22px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.fixbox input:focus{outline:3px solid var(--brand-soft);border-color:var(--brand)}
.tag.good{background:var(--lime-soft)}
.typed{margin:0;font-size:16px;color:var(--muted)}
.typed s{color:var(--red);font-family:var(--f-read);font-size:18px}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lvc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--tile);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--ink);min-width:0;transition:border-color .15s,transform .15s}
.lvc:hover{border-color:var(--brand);transform:translateY(-1px)}
.lvc.sug{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.lvc.done{background:var(--lime-soft);border-color:transparent}
.lvtop{display:flex;align-items:center;gap:6px}
.lvnum{font-family:var(--f-read);font-weight:600;font-size:15px;width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin-right:auto}
.lvc.done .lvnum{background:#FFFFFF;color:var(--lime)}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st.ok{background:var(--lime);color:#FFFFFF}.st.go{background:var(--brand-soft);color:var(--brand)}.st.nw{color:var(--muted);border:1px solid var(--line)}.st.sg{background:var(--saffron);color:var(--bar)}
.lvnm{font-weight:800;font-size:17px;line-height:1.25}
.lvsb{color:var(--muted);font-size:14px;line-height:1.35}
.lvft{display:flex;align-items:center;gap:10px;margin-top:4px}
.lvbar2{flex:1;height:6px;border-radius:99px;background:var(--brand-soft);overflow:hidden}
.lvbar2 i{display:block;height:100%;background:var(--brand);border-radius:99px}
.lvc.done .lvbar2{background:#FFFFFF}.lvc.done .lvbar2 i{background:var(--lime)}
.lvct{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.refs{font-family:var(--f-read);font-size:23px;line-height:1.55;margin:4px 0 0}
.refs b{font-weight:600;background:var(--brand-soft);padding:0 3px;border-radius:4px}
.reflist{display:flex;flex-direction:column;gap:8px;max-width:760px;width:100%;margin:0 auto}
.refopt{display:flex;align-items:center;gap:12px;min-height:0;text-align:left;padding:12px 14px;font-size:17px}
.refopt .lt{flex:none;width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:14px}
.refopt.ok .lt{background:#FFFFFF;color:var(--lime)}
.defq{text-align:center;font-family:var(--f-read);font-size:24px;line-height:1.4;margin:6px auto 0;max-width:34ch}
.wordtile{font-family:var(--f-read);font-weight:600;font-size:21px}
.others{max-width:760px;margin:0 auto;width:100%;background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.others b{font-size:14px;color:var(--muted);font-weight:700}
.others p{margin:0;font-size:15.5px}
.others span{font-family:var(--f-read);font-weight:600}
.anchor .dirs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.anchor .dirs i:nth-child(2){margin-left:8px}
@media (max-width:640px){.refs{font-size:19px}.refopt{font-size:15.5px}.defq{font-size:20px}.wordtile{font-size:17px}.sent{font-size:24px}.banner strong{font-size:24px}.word{font-size:25px}.tile{font-size:16px}}
</style>


</head>
<body>
<div id="app"></div>
<script>
const SUP = [
["s01","Leur ou leurs","Devant un verbe, leur est un pronom (= à eux, à elles) et ne prend jamais de s. Devant un nom, il s'accorde : leurs dossiers.",["Je [leurs|leur] ai transmis le compte rendu ce matin.","Nous [leurs|leur] répondrons dès lundi.","Les stagiaires ont rangé [leur|leurs] affaires avant de partir."]],
["s02","A ou à","a est le verbe avoir : on peut le remplacer par avait. à est une préposition.",["Le dossier [à|a] été validé par le comité.","Elle est partie [a|à] Lyon pour le séminaire.","Il reste beaucoup [a|à] faire avant la clôture."]],
["s03","S'est, c'est, ses, ces","s'est précède un participe passé (verbe pronominal). c'est = cela est. ses = les siens ; ces = démonstratif.",["Elle [c'est|s'est] trompée de salle.","[S'est|C'est] la meilleure offre que nous ayons reçue.","Il a égaré [ces|ses] propres clés."]],
["s04","Ou ou où","où (avec accent) indique le lieu ou le moment. ou sans accent signifie ou bien.",["La ville [ou|où] j'ai grandi a beaucoup changé.","Le jour [ou|où] il a signé, tout a basculé.","Voulez-vous du thé [où|ou] du café ?"]],
["s05","Infinitif ou participe en -é","Après une préposition (à, de, pour, sans) ou un verbe conjugué autre qu'avoir et être, on met l'infinitif. Astuce : remplacez par vendre ou vendu.",["Il faut [envoyé|envoyer] ce mail avant midi.","Nous avons [envoyer|envoyé] le contrat hier.","Elle est partie sans [prévenu|prévenir] personne."]],
["s06","Quant à ou quand","quant à signifie en ce qui concerne. quand indique le temps.",["[Quand|Quant] à moi, je reste jusqu'à la fin.","[Quant|Quand] il arrivera, nous commencerons.","[Quand|Quant] aux résultats, ils seront publiés vendredi."]],
["s07","Sujet placé après le verbe","Quand le sujet est inversé, le verbe s'accorde quand même avec lui. Cherchez qui fait l'action.",["Où [est|sont] passés les documents que je t'ai confiés ?","Dans ce dossier [figure|figurent] toutes les pièces justificatives.","Que [peut|peuvent] faire les auditeurs dans ce cas ?"]],
["s08","Participe passé avec avoir : COD placé avant","Avec avoir, le participe s'accorde avec le COD seulement si celui-ci est placé avant le verbe.",["Les fiches que j'ai [rempli|remplies] sont sur ton bureau.","Quelle décision as-tu [pris|prise] ?","Ces erreurs, je les ai [corrigé|corrigées] ce matin."]],
["s09","Participe passé avec avoir : COD placé après","Si le COD est placé après le verbe, ou s'il n'y a pas de COD, le participe reste invariable.",["Nous avons [reçus|reçu] vos candidatures.","Elles ont [travaillées|travaillé] tout le week-end.","Les associés ont [signés|signé] l'accord hier."]],
["s10","Futur (-rai) ou conditionnel (-rais)","Remplacez par nous : nous enverrons (futur, -rai) ou nous enverrions (conditionnel, -rais).",["Je vous [enverrais|enverrai] le document demain, comme promis.","Si vous aviez le temps, je [serai|serais] ravie de vous rencontrer.","J'[aimerai|aimerais] obtenir un rendez-vous, si possible."]],
["s11","Quel que, quelle que","Devant le verbe être au subjonctif, on écrit quel que en deux mots, accordé avec le sujet.",["[Quelque|Quelle que] soit votre décision, nous la respecterons.","[Quelques|Quels que] soient les résultats, nous publierons le rapport.","[Quelque|Quel que] soit le prix, il l'achètera."]],
["s12","Si + imparfait","Après si exprimant une condition, jamais de conditionnel : si j'avais su, et non si j'aurais su.",["Si j'[aurais|avais] su, je serais venue plus tôt.","Si vous [pourriez|pouviez] me rappeler, ce serait parfait.","S'il [serait|était] disponible, il nous aiderait."]],
["s13","Après que + indicatif","après que présente un fait réel : il se construit avec l'indicatif, contrairement à avant que.",["Après qu'il [soit|est] parti, la réunion a repris.","Après que nous [ayons|avons] signé, le prix a changé.","Après qu'elle [ait|a] présenté son rapport, chacun a applaudi."]],
["s14","Bien que, pour que + subjonctif","bien que, quoique, pour que, il faut que et à moins que sont suivis du subjonctif.",["Bien qu'il [est|soit] en retard, il a été reçu.","Il faut que tu [viens|viennes] avant midi.","Je l'explique pour que tout le monde [comprend|comprenne]."]],
["s15","Vingt et cent","vingt et cent prennent un s quand ils sont multipliés et terminent le nombre : trois cents, quatre-vingts. Suivis d'un autre nombre, ils restent invariables.",["Le projet a coûté trois [cent|cents] euros.","Nous avons reçu deux [cents|cent] cinquante candidatures.","Plus de quatre-[vingt|vingts] personnes étaient présentes."]],
["s16","Mille","mille, adjectif numéral, ne prend jamais de s.",["Elle a gagné trois [milles|mille] euros.","Le bâtiment accueille deux [milles|mille] salariés."]],
["s17","Appeler, jeter","appeler et jeter doublent le l ou le t devant un e muet : j'appelle, nous appelons ; je jette, nous jetons.",["Je vous [appèle|appelle] demain matin.","Nous [appellons|appelons] le client cet après-midi.","Il [jète|jette] toujours ses brouillons."]],
["s18","Censé ou sensé","censé = supposé (être censé faire). sensé = qui a du bon sens.",["Il est [sensé|censé] rendre son rapport lundi.","Nul n'est [sensé|censé] ignorer la loi.","C'est une remarque très [censée|sensée]."]],
["s19","Ci-joint","Invariable en tête de phrase ou devant un nom sans déterminant. Accordé quand il suit le nom : les pièces ci-jointes.",["[Ci-jointes|Ci-joint] les factures du mois.","Vous trouverez [ci-jointe|ci-joint] copie du contrat.","Les documents [ci-joint|ci-joints] sont à signer."]],
["s20","À l'attention ou à l'intention","à l'attention de s'emploie pour un courrier adressé à quelqu'un. à l'intention de signifie destiné à, en l'honneur de.",["Cette fête est organisée [à l'attention|à l'intention] de nos clients.","Courrier [à l'intention|à l'attention] de M. Durand, service comptable."]],
["s21","Je vous saurais gré","L'expression est savoir gré (être reconnaissant) : je vous saurais gré, et non serais.",["Je vous [serais|saurais] gré de bien vouloir me répondre.","Nous vous [serions|saurions] gré de régler cette facture."]],
["s22","Davantage","davantage (= plus) s'écrit en un seul mot. d'avantage n'existe qu'au sens de bénéfice : il n'y a pas d'avantage à...",["Je souhaiterais [d'avantage|davantage] de temps.","Il faut travailler [d'avantage|davantage] l'oral."]],
["s23","Quoique ou quoi que","quoique (= bien que) en un mot. quoi que (= quelle que soit la chose que) en deux mots.",["[Quoique|Quoi que] vous fassiez, faites-le bien.","[Quoi qu'il|Quoiqu'il] soit fatigué, il continue."]],
["s24","Langage","En français : langage, sans u. language est de l'anglais.",["Le [language|langage] juridique est très précis.","Elle maîtrise plusieurs [languages|langages] de programmation."]],
["s25","Pronominaux : accord avec le sujet","Les verbes toujours pronominaux (s'apercevoir, s'enfuir, se souvenir...) s'accordent avec le sujet.",["Elles se sont [aperçu|aperçues] de leur erreur.","Les candidates se sont [souvenu|souvenues] de la consigne.","Ils se sont [enfui|enfuis] avant la fin."]],
["s26","Pronominaux : COD placé après","Si le COD est placé après le verbe, le participe ne s'accorde pas : elle s'est lavé les mains (le COD est les mains).",["Elle s'est [lavée|lavé] les mains.","Ils se sont [partagés|partagé] les tâches.","Elle s'est [cassée|cassé] le poignet au ski."]],
["s27","Se téléphoner, se parler, se nuire","Quand le pronom est complément indirect (téléphoner à quelqu'un), le participe reste invariable.",["Elles se sont [téléphonées|téléphoné] hier soir.","Ils se sont [parlés|parlé] longuement.","Ils se sont [nuis|nui] l'un à l'autre."]],
["s28","Se succéder, se plaire","On succède à, on plaît à : le pronom est indirect, le participe reste invariable.",["Les ministres se sont [succédés|succédé] à ce poste.","Les deux associées se sont [plues|plu] dès le premier jour."]],
["s29","Fait suivi d'un infinitif","fait suivi d'un infinitif est toujours invariable : elle s'est fait remarquer.",["Elle s'est [faite|fait] remarquer en réunion.","Les maisons qu'ils ont [faites|fait] construire sont superbes.","Elles se sont [faites|fait] avoir."]],
["s30","En + participe passé","Avec le pronom en, le participe passé reste invariable.",["Des propositions, j'en ai [reçues|reçu] beaucoup.","Des erreurs, il en a [commises|commis] plusieurs."]],
["s31","Aucun","aucun reste au singulier, sauf devant un nom qui n'existe qu'au pluriel : aucuns frais.",["Il n'a fait [aucunes|aucune] erreur.","Cette opération n'entraîne [aucun|aucuns] frais."]],
["s32","En congé","Être en congé s'écrit au singulier. On écrit en revanche les congés payés.",["Elle est en [congés|congé] jusqu'à lundi.","Le directeur sera en [congés|congé] la semaine prochaine."]],
["s33","Au vu de","au vu de (= en considérant) s'écrit avec vu, participe de voir, sans e.",["Au [vue|vu] de vos résultats, nous validons le dossier.","Au [vue|vu] des circonstances, la réunion est reportée."]],
["s34","Pallier quelque chose","pallier est transitif direct : on pallie un problème, pas à un problème.",["Pour [pallier à|pallier] ce problème, nous recrutons.","Il faut [pallier au|pallier le] manque de personnel."]],
["s35","Se rappeler quelque chose","On se rappelle quelque chose, mais on se souvient de quelque chose.",["Je me rappelle [de cette|cette] réunion.","Tu te rappelles [de son|son] nom ?"]],
["s36","Malgré que","malgré que est fautif à l'écrit soigné : on emploie bien que ou quoique.",["[Malgré qu'il|Bien qu'il] pleuve, nous sortirons.","[Malgré qu'elle|Bien qu'elle] soit jeune, elle dirige l'équipe."]],
["s37","Demi","demi devant le nom est invariable, avec un trait d'union. Après le nom, il s'accorde en genre seulement : une heure et demie.",["J'ai attendu une [demie-heure|demi-heure].","Il est arrivé à trois heures et [demi|demie].","Rendez-vous à midi et [demie|demi]."]],
["s38","Nu-pieds, pieds nus","nu devant le nom est invariable, avec un trait d'union. Après le nom, il s'accorde.",["Il marchait [nus-pieds|nu-pieds] sur la plage.","Elle est sortie [nue-tête|nu-tête]."]],
["s39","Adjectifs de couleur","Un nom employé comme couleur reste invariable (marron, orange), tout comme une couleur composée (bleu clair).",["Il porte des chaussures [marrons|marron].","Elle a les yeux [bleus|bleu] clair.","Des rideaux [oranges|orange] pendaient aux fenêtres."]],
["s40","Le plus possible","Après le plus, le moins, le meilleur..., possible reste invariable.",["Faites le moins d'erreurs [possibles|possible].","Contactez le plus de clients [possibles|possible]."]],
["s41","Quelque devant un nombre","Devant un nombre, quelque signifie environ et reste invariable.",["Il y a [quelques|quelque] vingt ans, l'entreprise était minuscule.","Le salon a réuni [quelques|quelque] trois cents exposants."]],
["s42","Même adverbe","Quand même signifie aussi, y compris, c'est un adverbe invariable.",["[Mêmes|Même] les experts se sont trompés.","Ils ont [mêmes|même] oublié de prévenir le client."]],
["s43","Tout adverbe","tout (= entièrement) est invariable, sauf devant un adjectif féminin commençant par une consonne ou un h aspiré : toute petite, mais tout étonnée.",["Elle était [tout|toute] petite.","Elles sont [toutes|tout] émues.","Elles sont rentrées [tout|toutes] honteuses."]],
["s44","Quelle ou qu'elle","qu'elle = que + elle (on peut remplacer par qu'il). quel, quelle est un déterminant.",["Je ne sais pas [qu'elle|quelle] heure il est.","Il faut [quelle|qu'elle] rende le dossier ce soir."]],
["s45","S'en ou sans","s'en (se + en) accompagne un verbe pronominal : il s'en souvient. sans est une préposition.",["Il [sans|s'en] souvient très bien.","Elle est partie [s'en|sans] dire au revoir."]],
["s46","Peu, peut, peux","peut et peux viennent de pouvoir (remplacez par pouvait). peu est un adverbe de quantité.",["Il [peu|peut] venir demain.","Il reste [peut|peu] de places.","Je ne [peut|peux] pas assister à la réunion."]],
["s47","Parmi","parmi ne prend jamais de s.",["[Parmis|Parmi] les candidats, trois ont été retenus.","Elle s'est glissée [parmis|parmi] les invités."]],
["s48","Quelquefois","quelquefois (= parfois) s'écrit en un mot. Le singulier quelque fois n'existe pas dans ce sens.",["Je vais [quelque fois|quelquefois] au théâtre.","Il arrive [quelque fois|quelquefois] que le serveur plante."]],
["s49","Infinitif sous-entendu","dû, pu, voulu, cru... restent invariables quand un infinitif est sous-entendu après eux.",["Il a fait tous les efforts qu'il a [pus|pu].","J'ai fait toutes les démarches que j'ai [dues|dû]."]],
["s50","Verbes impersonnels","Le participe d'un verbe impersonnel (il y a, il faut, il fait) est toujours invariable.",["Les orages qu'il y a [eus|eu] ont tout ravagé.","Les efforts qu'il a [fallus|fallu] ont été considérables.","Les chaleurs qu'il a [faites|fait] ont épuisé l'équipe."]],
["s51","Coûter, valoir, peser au sens propre","Au sens propre (prix, durée, poids), ces participes restent invariables : les mille euros que ce stage m'a coûté.",["Les mille euros que ce stage m'a [coûtés|coûté] seront remboursés.","Les quatre-vingts kilos qu'il a [pesés|pesé] autrefois ne sont plus qu'un souvenir."]],
["s52","La plupart","Après la plupart, le verbe se met au pluriel.",["La plupart des candidats [a|ont] réussi.","La plupart [pense|pensent] que le projet est viable."]],
["s53","Soi-disant","soi-disant s'écrit avec soi (soi-même) et reste invariable.",["C'est une [soit-disant|soi-disant] experte.","Les [soi-disants|soi-disant] spécialistes se sont trompés."]],
["s54","Voire","voire (= et même) prend un e. voir est le verbe.",["Cela prendra des semaines, [voir|voire] des mois.","Il est réticent, [voir|voire] hostile."]],
["s55","Participe passé suivi d'un infinitif","Avec avoir, le participe suivi d'un infinitif s'accorde si le COD placé avant fait l'action de l'infinitif.",["Les musiciens que j'ai [entendu|entendus] jouer étaient excellents.","Les airs que j'ai [entendus|entendu] jouer étaient anciens.","La candidate que j'ai [vu|vue] partir semblait déçue."]],
["s56","Avant que + subjonctif","avant que appelle le subjonctif : avant qu'il parte.",["Prévenez-moi avant qu'il [part|parte].","Avant que nous [finissons|finissions], une dernière question ?"]],
["s57","Excepté, vu, y compris","Placés devant le nom, ces mots sont des prépositions invariables.",["[Exceptées|Excepté] les deux dernières pages, tout est prêt.","[Vues|Vu] les circonstances, nous annulons.","Y [comprises|compris] les taxes, le total s'élève à 500 euros."]],
["s58","Au temps pour moi","L'expression traditionnelle est au temps pour moi (on reprend au temps précédent), même si autant pour moi est répandu.",["[Autant|Au temps] pour moi, je me suis trompée de date."]],
["s59","Différend ou différent","différend (avec d) = désaccord. différent = pas pareil.",["Ils ont un [différent|différend] commercial depuis des mois.","Les deux offres sont très [différendes|différentes]."]],
["s60","Acquit ou acquis","acquit vient d'acquitter (par acquit de conscience). acquis vient d'acquérir (un acquis social).",["Par [acquis|acquit] de conscience, j'ai tout revérifié.","C'est un [acquit|acquis] social important."]],
["s61","Subjonctif après un verbe de volonté ou de sentiment","Les verbes de volonté (vouloir, exiger, souhaiter, demander) et de sentiment (regretter, craindre, être ravi, avoir peur) se construisent avec que + subjonctif.",["Je souhaite que vous [venez|veniez] à la réunion.","Je regrette qu'il [faut|faille] tout recommencer.","La directrice exige que le rapport [est|soit] prêt ce soir.","Nous sommes ravis que vous [avez|ayez] accepté notre offre."]],
["s62","Action postérieure à un verbe au passé","Quand le verbe principal est au passé, l'action qui vient après se met au conditionnel présent (futur dans le passé) : il a dit qu'il viendrait.",["Il m'avait promis qu'il [viendra|viendrait] à la soirée.","Elle a annoncé qu'elle [quittera|quitterait] le cabinet en juin.","Je savais bien que tu [réussiras|réussirais]."]],
["s63","Subjonctif après certaines conjonctions","en attendant que, afin que, pour que, de peur que, bien que, quoique se construisent obligatoirement avec le subjonctif.",["En attendant que le directeur [est|soit] disponible, patientez ici.","Je répète la consigne afin que chacun la [retient|retienne].","Il se tait de peur qu'on le [prend|prenne] pour un menteur."]]
];

const EXC = [
["e01","Infarctus","On écrit infarctus (pensez à farci, du latin farcire), pas infractus.",["Il a été victime d'un [infractus|infarctus]."]],
["e02","Rémunération","rémunérer vient du latin munus (cadeau) : ré-mu-né-rer. Rénumérer n'existe pas.",["La [rénumération|rémunération] proposée est attractive.","Ce stage est [rénuméré|rémunéré]."]],
["e03","Aréopage","aréopage (assemblée de personnes compétentes) vient de l'Aréopage d'Athènes, pas d'aéroport.",["Un [aéropage|aréopage] d'experts a examiné le dossier."]],
["e04","Dilemme","dilemme s'écrit avec deux m, sans n.",["Elle fait face à un véritable [dilemne|dilemme]."]],
["e05","Pécuniaire","pécuniaire (relatif à l'argent) a la même forme au masculin et au féminin.",["Il rencontre des difficultés [pécunières|pécuniaires].","Un avantage [pécunier|pécuniaire] a été accordé."]],
["e06","Rasséréner","rasséréner : rendre serein. Ras-séré-ner, et non rassé-né-rer.",["Après l'appel, elle semblait [rassénérée|rassérénée]."]],
["e07","Conjecture ou conjoncture","conjecture = hypothèse, supposition. conjoncture = situation, ensemble des circonstances.",["La [conjecture|conjoncture] économique est défavorable.","Nous en sommes réduits aux [conjonctures|conjectures]."]],
["e08","Éminent ou imminent","éminent = remarquable. imminent = qui va arriver très bientôt.",["Le départ du directeur est [éminent|imminent].","C'est un [imminent|éminent] spécialiste du droit fiscal."]],
["e09","Prolixe ou prolifique","prolixe = trop long, bavard. prolifique = qui produit beaucoup.",["L'orateur, trop [prolifique|prolixe], a lassé l'auditoire.","Cet auteur [prolixe|prolifique] publie trois romans par an."]],
["e10","Inclination ou inclinaison","inclination = penchant, goût. inclinaison = état de ce qui est penché.",["Il a toujours eu une [inclinaison|inclination] pour les arts.","L'[inclination|inclinaison] du toit est de 30 degrés."]],
["e11","Acception ou acceptation","acception = sens d'un mot. acceptation = fait d'accepter.",["Le mot est pris dans toutes ses [acceptations|acceptions].","L'[acception|acceptation] de l'offre a été rapide."]],
["e12","Perpétrer ou perpétuer","perpétrer = commettre (un crime). perpétuer = faire durer.",["Ils ont [perpétué|perpétré] un attentat.","Elle [perpètre|perpétue] la tradition familiale."]],
["e13","À l'envi","à l'envi (sans e) signifie à qui mieux mieux, en rivalisant. Rien à voir avec l'envie.",["Ils répétaient cet argument à l'[envie|envi]."]],
["e14","S'avérer","s'avérer signifie se révéler vrai : s'avérer faux est contradictoire. On écrit se révéler faux.",["La rumeur s'est [avérée|révélée] fausse."]],
["e15","En définitive","La locution est en définitive (au féminin).",["En [définitif|définitive], le projet est abandonné."]],
["e16","Quoi qu'il en soit","Quoi qu'il en soit s'écrit en deux mots : quelle que soit la chose qui en est.",["[Quoiqu'il|Quoi qu'il] en soit, nous maintenons la date."]],
["e17","Se faire fort de","Dans se faire fort de, fort reste invariable.",["Elles se font [fortes|fort] de convaincre le jury."]],
["e18","Rebattre les oreilles","On rebat les oreilles (répéter sans cesse) ; un sujet rebattu est usé. rabattre veut dire ramener vers le bas.",["Il nous [rabat|rebat] les oreilles avec ses vacances.","C'est un sujet [rabattu|rebattu]."]],
["e19","Tout autre","tout autre = complètement différent : tout est adverbe, invariable. Mais toute autre = n'importe quelle autre.",["C'est une [toute|tout] autre affaire.","Toute autre proposition sera étudiée."]],
["e20","Feu (défunt)","feu est invariable placé avant le déterminant (feu la reine), variable entre le déterminant et le nom (la feue reine).",["[Feue|Feu] la reine était très aimée.","La [feu|feue] reine était très aimée."]],
["e21","Pluriel des noms composés","Dans chef-d'œuvre ou arc-en-ciel, seul le premier nom prend la marque du pluriel.",["Le musée expose plusieurs [chef-d'œuvres|chefs-d'œuvre].","Deux [arcs-en-ciels|arcs-en-ciel] apparurent après l'orage."]],
["e22","Pronominaux : COD placé avant","Quand le COD est placé avant (que, les...), le participe s'accorde avec lui : les droits qu'elle s'est arrogés.",["Les privilèges qu'elle s'est [arrogé|arrogés] sont exorbitants.","Les lettres qu'ils se sont [écrit|écrites] sont émouvantes."]],
["e23","Se rendre compte","Dans se rendre compte, le COD est compte : le participe rendu reste invariable.",["Elles se sont [rendues|rendu] compte de leur erreur.","Nous nous sommes [rendus|rendu] compte du problème trop tard."]],
["e24","Se permettre","On permet à quelqu'un : se est indirect, permis reste invariable.",["Elle s'est [permise|permis] d'intervenir.","Ils se sont [permises|permis] quelques remarques."]],
["e25","Fut ou fût","fût (accent) est le subjonctif imparfait ; fut (sans accent) le passé simple. Même logique pour vînt / vint.",["Bien qu'il [fut|fût] tard, il travailla encore.","Il [fût|fut] élu à l'unanimité.","Il eût fallu qu'il [vint|vînt] plus tôt."]],
["e26","Eut ou eût","Après dès que, quand, lorsque au passé, on emploie le passé antérieur : il eut fini (sans accent).",["Dès qu'il [eût|eut] terminé, il partit.","Quand elle [eût|eut] fini son discours, on applaudit."]],
["e27","Comme si + imparfait","comme si se construit comme si : jamais de conditionnel derrière.",["Il agit comme s'il [serait|était] le patron.","Elle parle comme si elle [aurait|avait] tout compris."]],
["e28","Tant pis, qui pis est","pis est l'adverbe (comparatif de mal) : tant pis, qui pis est, de mal en pis.",["Tant [pire|pis] pour lui.","Qui [pire|pis] est, il a menti."]],
["e29","Ce dont, ce que","On a besoin de quelque chose : ce dont j'ai besoin. On parle de quelque chose : ce dont il est question.",["C'est ce [que|dont] j'ai besoin.","Voilà ce [qu'il|dont il] est question."]],
["e30","Dont redondant","Quand de est déjà exprimé (c'est de lui...), on emploie que, pas dont.",["C'est de lui [dont|que] je parle.","C'est de ce projet [dont|que] nous avons parlé."]],
["e31","Vitupérer","vitupérer est transitif direct : on vitupère quelque chose, pas contre quelque chose.",["Il [vitupère contre|vitupère] la réforme.","Les syndicats [vitupèrent contre|vitupèrent] ce projet."]],
["e32","Accaparer","accaparer n'est pas pronominal : on accapare quelque chose.",["Il [s'est accaparé|a accaparé] le marché.","Elle [s'accapare|accapare] toutes les ressources."]],
["e33","Avoir affaire à","avoir affaire à quelqu'un (= être en rapport avec). avoir à faire = avoir du travail.",["J'ai eu [à faire|affaire] à un client difficile.","Vous aurez [à faire|affaire] à la direction."]],
["e34","Au jour d'aujourd'hui","aujourd'hui contient déjà hui (ce jour) : au jour d'aujourd'hui est un pléonasme.",["[Au jour d'aujourd'hui|Aujourd'hui], tout a changé."]],
["e35","Pléonasmes","Évitez de répéter une idée déjà contenue dans un mot : prévoir à l'avance, collaborer ensemble, réitérer à nouveau.",["Il faut [prévoir à l'avance|prévoir] les risques.","Ils ont [collaboré ensemble|collaboré] sur ce dossier.","Il a [réitéré à nouveau|réitéré] sa demande."]],
["e36","Car en effet","car et en effet expriment tous deux la cause : car en effet est un pléonasme.",["Il est absent, [car en effet|car] il est malade."]],
["e37","Genre des noms","Pièges de genre : un haltère, un tentacule, des effluves (masculin), une oasis.",["Il soulève [une|un] haltère de dix kilos.","[Une|Un] tentacule s'enroula autour du mât.","C'était [un|une] oasis de calme.","Les [premières|premiers] effluves du printemps arrivent."]],
["e38","Agonir","agonir = accabler (d'injures). agoniser = être à l'agonie.",["Ils l'ont [agonisé|agoni] d'injures."]],
["e39","Compréhensible ou compréhensif","compréhensible = qu'on peut comprendre. compréhensif = indulgent, qui comprend les autres.",["Ses explications sont très [compréhensives|compréhensibles].","Son manager s'est montré [compréhensible|compréhensif]."]],
["e40","Effraction ou infraction","effraction = bris de clôture pour entrer. infraction = violation d'une règle.",["Les voleurs sont entrés par [infraction|effraction].","Stationner ici est une [effraction|infraction]."]],
["e41","Recouvrer ou recouvrir","recouvrer = récupérer (la vue, une créance). recouvrir = couvrir de nouveau, cacher.",["Il a [recouvert|recouvré] la vue après l'opération.","Le service contentieux doit [recouvrir|recouvrer] les créances."]],
["e42","Tâche ou tache","tâche (accent) = travail à faire. tache = salissure.",["C'est une [tache|tâche] difficile.","Il y a une [tâche|tache] d'encre sur le contrat."]],
["e43","Quelque + adjectif","Devant un adjectif, quelque (= si) est adverbe et invariable : quelque brillants qu'ils soient.",["[Quelques|Quelque] brillants qu'ils soient, ils échoueront.","[Quelques|Quelque] habiles qu'elles paraissent, elles se trompent."]],
["e44","Tel quel","tel quel (= sans changement) ; tel que doit introduire une comparaison ou une conséquence.",["Je vous rends le dossier [tel que|tel quel]."]],
["e45","Tel sans que","Employé sans que, tel s'accorde avec le nom qui suit : il fonçait, telle une flèche.",["Il fonçait, [tel|telle] une flèche.","Elle rugissait, [telle|tel] un lion."]],
["e46","Ès","ès (= en les) s'écrit avec un accent grave : docteur ès lettres.",["Elle est docteur [es|ès] lettres."]],
["e47","Partisan","Le féminin de partisan est partisane.",["Elle est [partisante|partisane] de la réforme."]],
["e48","Quasi","quasi prend un trait d'union devant un nom (une quasi-certitude), pas devant un adjectif (quasi complet).",["C'est une [quasi certitude|quasi-certitude].","Le dossier est [quasi-complet|quasi complet]."]],
["e49","Au cas où + conditionnel","au cas où est suivi du conditionnel.",["Au cas où il [vienne|viendrait], préparez une salle."]],
["e50","Douter que + subjonctif","Après douter que, ne pas penser que, ne pas croire que, on emploie le subjonctif.",["Je doute qu'il [vient|vienne] demain.","Je ne pense pas qu'il [a|ait] raison."]],
["e51","Plus d'un","Après plus d'un, le verbe se met au singulier.",["Plus d'un candidat [ont|a] échoué."]],
["e52","Moins de deux","Après moins de deux, le verbe se met au pluriel.",["Moins de deux mois [s'est|se sont] écoulés."]],
["e53","C'est vous qui","Après qui, le verbe s'accorde avec l'antécédent : c'est vous qui avez, c'est nous qui avons.",["C'est vous qui [a|avez] raison.","C'est nous qui [ont|avons] gagné."]],
["e54","Sans que, sans ne","Après sans que, on évite le ne explétif.",["Il est parti sans que je [ne le|le] sache."]],
["e55","Fond, fonds, fonts","fonds = capital, argent (fonds propres). fond = partie basse ou éloignée. fonts baptismaux.",["Les [fond|fonds] propres de la société ont augmenté.","Les [fonds|fonts] baptismaux sont en marbre.","Au [fonds|fond] du couloir, à droite."]],
["e56","Prémices ou prémisses","prémices = premiers signes. prémisses = propositions d'un raisonnement.",["Les [prémisses|prémices] du printemps se font sentir.","Les [prémices|prémisses] du raisonnement sont fausses."]],
["e57","Collusion ou collision","collusion = entente secrète. collision = choc.",["On soupçonne une [collision|collusion] entre le maire et le promoteur."]],
["e58","Empreint ou emprunt","empreint de = marqué par. emprunt = action d'emprunter.",["Un discours [emprunt|empreint] de nostalgie."]],
["e59","Armistice ou amnistie","armistice (masculin) = suspension des combats. amnistie = effacement de peines.",["L'[amnistie|armistice] fut signé le 11 novembre 1918."]],
["e60","Martyre ou martyr","martyre = supplice. martyr = personne qui le subit.",["Il a subi un véritable [martyr|martyre].","C'est un [martyre|martyr] de la cause."]]
];

["i09","Passé simple en -it, -ut, -int","Au passé simple, finir, partir et ouvrir font -it (il finit, il partit, il ouvrit), courir et mourir font -ut (il courut, il mourut), venir et tenir font -int (il vint, il tint).",["Il [courit|courut] jusqu'à la gare.","Elle [ouvra|ouvrit] la porte sans bruit.","Ils [partèrent|partirent] à l'aube.","Le roi [mourit|mourut] en 1715."]],
["i10","Participes passés en -i, -is, -u, -ert","Participes passés : fini, parti, senti (en -i) ; acquis, conquis, mis (en -is) ; couru, tenu, venu (en -u) ; ouvert, offert, couvert (en -ert). Mettez au féminin pour entendre la consonne finale : acquise, ouverte.",["Elle a [ouvri|ouvert] un compte à Bangkok.","Il a [courut|couru] un grand risque.","Les compétences [acquisent|acquises] en stage sont précieuses."]],
["i11","Bénir : béni ou bénit","Le participe passé de bénir est béni (béni par le ciel). La forme bénit, bénite ne s'emploie que pour les objets consacrés : de l'eau bénite.",["Il s'est senti [bénit|béni] des dieux.","Le prêtre a versé de l'eau [bénie|bénite]."]],
["s79","Jours et mois","Les noms de jours et de mois s'écrivent avec une minuscule.",["Rendez-vous [Lundi|lundi] prochain à 10 heures.","Le salon a lieu en [Mars|mars]."]]

const EXC2 = [
["x01","« fatigant » ou « fatiguant » ?","L'adjectif s'écrit -gant (fatigant, intrigant, navigant, extravagant) ; le participe présent garde le u (en fatiguant). Astuce : si l'on peut mettre le mot au féminin, c'est l'adjectif.",["Ce trajet quotidien est très [fatiguant|fatigant].","Le personnel [naviguant|navigant] est en grève.","C'est un homme [intriguant|intrigant].","Nous avons appris des mots de marin en [navigant|naviguant] avec nos parents."]],
["x02","« convaincant » ou « convainquant » ?","L'adjectif s'écrit -cant (convaincant, suffocant, provocant, communicant) ; le participe présent s'écrit -quant (en convainquant).",["Une fumée [suffoquante|suffocante] envahit la pièce.","Ses arguments sont [convainquants|convaincants].","Il a perdu en [provocant|provoquant] son rival."]],
["x03","« négligent » ou « négligeant » ?","Certains adjectifs s'écrivent -ent alors que le participe présent s'écrit -ant : négligent / négligeant, divergent / divergeant, précédent / précédant, influent / influant.",["Ces employés ont été [négligeants|négligents].","Les deux experts ont des avis [divergeants|divergents].","C'est un homme très [influant|influent].","Les jours [précédents|précédant] l'examen, il dormait peu."]],
["x04","« cote » ou « côte » ?","cote (sans accent) = notation, cotation, évaluation : la cote d'une action, une cote de popularité. côte = os, pente, littoral.",["Sa [côte|cote] de popularité est en baisse.","La [côte|cote] de cette action a chuté.","Il s'est cassé une [cote|côte] au ski."]],
["x05","« je joins », « il peint »","Les verbes en -indre perdent le d au présent : je joins, tu peins, il craint, il peint.",["Tu [feinds|feins] la surprise alors que tu savais tout.","Je [crainds|crains] le pire pour ce dossier.","Il [peind|peint] la façade lui-même.","Elle [rejoind|rejoint] l'équipe lundi."]],
["x06","« nombre de », « quantité de »","Sans article, nombre et quantité restent au singulier, même suivis d'un verbe au pluriel : nombre de clients ont appelé.",["[Nombres|Nombre] de clients ont appelé ce matin.","[Quantités|Quantité] de dossiers restent en suspens."]],
["x07","« en congé », « en vacances »","On écrit en congé au singulier, mais en vacances au pluriel (la vacance, au singulier, désigne un poste non pourvu).",["Elle est en [congés|congé] jusqu'à lundi.","Ils partent en [vacance|vacances] demain.","Peut-on partir en vacances pendant sa période d'essai ?"]],
["x08","« enclin », « encline »","enclin (= porté naturellement à) s'accorde comme fin / fine : il est enclin, elle est encline. On est enclin à quelque chose, jamais enclin pour.",["Notre voisine est [enclin|encline] à la générosité.","Il est [enclin pour|enclin à] la paresse.","Ces clients sont peu [enclin|enclins] à négocier."]],
["x12","« çà et là »","L'adverbe çà prend un accent grave et ne se rencontre plus guère que dans çà et là (= de côté et d'autre). là prend aussi un accent grave, qui le distingue de l'article la.",["Les élèves étaient assis [ça|çà] et là dans la cour.","Des papiers traînaient çà et [la|là] sur le bureau."]],
["x13","« répercussion », « percussion »","répercussion (= conséquence) et percussion se terminent par -ssion, comme discussion ou concussion.",["Cette décision aura des [répercutions|répercussions] sur les prix.","Le médecin pratique des [percutions|percussions] sur le thorax."]],
["x09","« quiz »","quiz s'écrit avec un seul z et reste invariable : des quiz.",["Nous avons organisé deux [quizz|quiz] sur la fiscalité."]],
["x10","« saynète »","saynète (petite pièce comique) vient de l'espagnol sainete ; rien à voir avec scène.",["Les élèves ont joué une [scénette|saynète] très drôle."]],
["x11","« sceptique » ou « septique » ?","sceptique = qui doute. septique = qui contient des germes (fosse septique).",["Je reste [septique|sceptique] sur la réussite du projet.","La maison possède une fosse [sceptique|septique]."]],
["x16","Accueillir, recueil","Après c ou g, on écrit -ueil pour garder le son dur : accueil, cueillir, recueil, orgueil.",["Elle a [acceuilli|accueilli] les clients.","Il publie un [receuil|recueil] de nouvelles."]],
["x17","« hiverner » ou « hiberner » ?","hiberner = passer l'hiver en sommeil (animaux). hiverner = passer l'hiver à l'abri (troupeaux, navires, personnes).",["Les marmottes [hivernent|hibernent] jusqu'au printemps.","Les navires [hibernent|hivernent] au port."]],
["x18","« chez le coiffeur »","On va au magasin, à la banque, mais chez une personne : chez le coiffeur, chez le médecin.",["Je vais [au|chez le] coiffeur demain.","Elle est allée [au|chez le] dentiste."]],
["x21","« repaire » ou « repère » ?","repaire = refuge (de bêtes ou de brigands). repère = marque qui sert à se situer.",["Les brigands avaient leur [repère|repaire] dans la forêt.","Ce chiffre sert de point de [repaire|repère]."]],
["x22","« balade » ou « ballade » ?","balade (un l) = promenade. ballade (deux l) = poème ou chanson.",["Nous avons fait une [ballade|balade] en forêt.","Villon a écrit de célèbres [balades|ballades]."]],
["x23","« Lune », « Terre », « Soleil »","Les noms d'astres prennent une majuscule au sens astronomique : marcher sur la Lune. Dans les expressions courantes, minuscule : être dans la lune.",["Neil Armstrong a marché sur la [lune|Lune].","La [terre|Terre] tourne autour du Soleil.","Il est souvent dans la lune."]],
["x24","« excepté »","Placé devant le nom, excepté est invariable ; placé après, il s'accorde : les stagiaires exceptés.",["[Exceptés|Excepté] les deux stagiaires, tout le monde est venu.","[Exceptée|Excepté] la directrice, personne n'était au courant."]],
["x25","« lesdits », « ladite »","ledit, ladite, lesdits, dudit, auxdits s'écrivent en un seul mot.",["[Les dits|Lesdits] documents sont joints.","[La dite|Ladite] société est en liquidation."]],
["x26","« bellâtre », « verdâtre »","Le suffixe -âtre prend un accent circonflexe : bellâtre, verdâtre, douceâtre, marâtre.",["Ce [bellatre|bellâtre] se croit irrésistible.","L'eau avait une couleur [verdatre|verdâtre]."]],
["x27","« naguère » ou « jadis » ?","naguère = il y a peu de temps ; jadis = il y a très longtemps. naguère s'écrit avec un seul r (n'a guère).",["[Naguère|Jadis], au temps des pharaons, l'écriture était réservée aux scribes.","Il était [naguerre|naguère] encore stagiaire."]],
["x28","« ressaisir », « ressortir »","Avec le préfixe re-, on double le s pour garder le son [s] : ressaisir, ressentir, ressortir.",["Il s'est [resaisi|ressaisi] à temps.","Ce point [resort|ressort] clairement du rapport."]],
["x29","« etc. »","etc. (et cetera) se termine par un seul point, jamais par des points de suspension.",["Il a acheté des pommes, des poires, [etc...|etc.]"]],
["x30","« que nous soyons », « que vous ayez »","Au subjonctif présent, être et avoir n'ont pas de i après le y : que nous soyons, que vous ayez.",["Il faut que nous [soyions|soyons] prêts à 8 heures.","Je souhaite que vous [ayiez|ayez] le temps de relire."]],
["x31","« M. », « Mme »","Monsieur s'abrège M. (et non Mr, abréviation anglaise) ; Madame s'abrège Mme, sans point.",["[Mr|M.] Durand vous attend à l'accueil.","[Mme.|Mme] Petit a validé le dossier."]],
["x32","« statu quo »","statu quo s'écrit sans t (du latin in statu quo ante).",["Les négociateurs ont maintenu le [statut quo|statu quo]."]],
["x33","Couleurs composées","Les adjectifs de couleur composés restent invariables : des yeux bleu-vert, des cravates gris-bleu.",["Elle a les yeux [bleus-verts|bleu-vert].","Il porte des cravates [gris-bleues|gris-bleu]."]],
["x34","« subit » ou « subi » ?","subit = soudain (subite au féminin). subi = participe passé de subir (subie).",["Un changement [subi|subit] de météo a surpris les randonneurs.","Les pertes [subites|subies] par l'entreprise sont lourdes."]],
["x35","Pluriel des noms composés (nom + nom)","Quand un nom composé réunit deux noms, ou un nom et un adjectif, les deux prennent la marque du pluriel : des adjudants-chefs, des choux-fleurs.",["Deux [adjudant-chefs|adjudants-chefs] ont été promus.","Nous avons acheté des [chou-fleurs|choux-fleurs]."]],
["x37","Tout devant h muet ou h aspiré","Devant un adjectif féminin commençant par un h muet, tout reste invariable (tout heureuse) ; devant un h aspiré, il s'accorde (toute honteuse).",["Elle était [toute|tout] heureuse de son résultat.","Elle est repartie [tout|toute] honteuse."]],
["x38","« une alternative »","Une alternative désigne déjà le choix entre deux possibilités : parler de deux alternatives est maladroit.",["Nous avons [deux alternatives|une alternative] : partir ou rester."]],
["x39","Impératif et trait d'union","À l'impératif, on relie par un trait d'union le verbe et le pronom qui le complète : dis-moi, donne-le. Mais viens le voir : le complète voir, pas viens.",["[Dis moi|Dis-moi] la vérité.","[Donne le|Donne-le] à Paul.","[Viens-le|Viens le] voir demain."]],
["x40","Noms de langue","Les noms de langue s'écrivent avec une minuscule ; les habitants prennent une majuscule (les Anglais parlent anglais).",["Elle apprend l'[Anglais|anglais] depuis deux ans.","Il parle couramment le [Thaï|thaï]."]],
["x41","Saint-Étienne, saint Paul","Dans un nom de lieu, de rue ou de fête, Saint prend une majuscule et un trait d'union (Saint-Étienne, la Saint-Jean). Pour le saint lui-même : saint Paul, sans trait d'union.",["Elle habite à [Saint Étienne|Saint-Étienne].","Rendez-vous rue [Saint Jacques|Saint-Jacques].","L'apôtre saint Paul a écrit de nombreuses lettres."]],
["x42","Majuscules accentuées","Les majuscules gardent leurs accents : Étienne, À l'attention de, État.",["[Etienne|Étienne] arrive demain.","[A|À] l'attention du directeur financier."]],
["x43","Noms de famille au pluriel","Les noms de famille ne prennent pas de s : les Martin, les Dupont.",["Nous dînons chez les [Martins|Martin] samedi."]],
["x44","Amener, emmener, apporter","amener et emmener s'emploient pour des personnes ou des animaux ; pour un objet, on dit apporter ou emporter.",["Peux-tu m'[amener|apporter] le dossier ?","N'oublie pas d'[emmener|emporter] ton ordinateur."]],
["x45","Points cardinaux","Minuscule pour une direction ou une position (à l'ouest de Lyon) ; majuscule pour une région (l'Ouest canadien).",["La ville se trouve à l'[Ouest|ouest] de Paris.","Il a grandi dans l'Ouest canadien."]],
["x46","Verbes essentiellement pronominaux","Les verbes toujours pronominaux (s'évanouir, s'enfuir, se méfier, s'emparer) s'accordent avec le sujet.",["Elles se sont [évanoui|évanouies] de chaleur.","Ils se sont [emparé|emparés] du marché."]],
["x47","Pronominaux de sens passif","Quand le sujet subit l'action (ces maisons se sont vendues = ont été vendues), le participe s'accorde avec le sujet.",["Ces appartements se sont [vendu|vendus] en une semaine.","Les places se sont [arraché|arrachées] en une heure."]],
["x48","Se plaire, se rire, se succéder","Ces participes restent invariables : on plaît à, on rit de, on succède à.",["Elles se sont [plues|plu] à Paris.","Ils se sont [ris|ri] de nos efforts.","Les crises se sont [succédées|succédé] cette année."]],
["x49","Pronominaux : COD placé après","Elle s'est coupé les cheveux : le COD (les cheveux) est placé après le verbe, donc pas d'accord.",["Elle s'est [coupée|coupé] les cheveux.","Ils se sont [lavés|lavé] les mains."]],
["x50","Pronominaux réciproques avec COI","Ils se sont écrit (on écrit à quelqu'un) : le pronom est indirect, le participe reste invariable.",["Ils se sont [écrits|écrit] tous les jours.","Elles se sont [souries|souri] en se croisant."]],
["x51","S'être fait + infinitif","fait suivi d'un infinitif reste invariable : elle s'est fait opérer.",["Elle s'est [faite|fait] opérer la semaine dernière.","Ils se sont [faits|fait] rembourser."]],
["x53","Se donner du mal","Dans elles se sont donné du mal, se est indirect (à elles) et le COD (du mal) est placé après : pas d'accord.",["Elles se sont [données|donné] beaucoup de mal.","Ils se sont [accordés|accordé] une pause."]]
];

const RX=/\[([^|\]]*)\|([^\]]*)\]/g;

function tokens(parts,ver){
  const ch=[],fl=[];
  parts.forEach(pt=>{const t=pt.err?(ver==="w"?pt.w:pt.r):pt.p;for(const c of t){ch.push(c);fl.push(!!pt.err);}});
  for(let i=0;i<ch.length;i++){if(ch[i]===" "&&(/[:;!?»]/.test(ch[i+1]||"")||ch[i-1]==="«"))ch[i]=" ";}
  const out=[];let cur="",err=false;
  for(let i=0;i<ch.length;i++){if(ch[i]===" "){if(cur)out.push({t:cur,err});cur="";err=false;}else{cur+=ch[i];if(fl[i])err=true;}}
  if(cur)out.push({t:cur,err});

}
const hasErr=s=>{RX.lastIndex=0;return RX.test(s);};

function build(rule){
  if(rule.type==="tap"){
    const item=rand(rule.items);const parts=parse(item);const e=hasErr(item);
    const showErr=e&&Math.random()<0.62;
    return {rule,kind:"tap",parts,canErr:e,showErr,toks:tokens(parts,showErr?"w":"r"),done:false};
  }
  if(rule.type==="voc"){
    const base=rule.g?GPOOL[rule.g]:VOCR.filter(v=>!v.g);
    const st=S[ses.m].r[rule.id]||{},n=need(rule,st);
    const dir=st.m?(Math.random()<.5?"wd":"dw"):(st.wd||0)>=n?"dw":(st.dw||0)>=n?"wd":(Math.random()<.5?"wd":"dw");

        return (v.e===rule.p||rule.e===v.p?100:0)+cp*3+(cs>=2?cs*2:0)-Math.abs(A.length-B.length)*.5+(A[0]===B[0]?1:0)+((/ /.test(rule.t))===(/ /.test(v.t))?3:0)+Math.random();};

    }
    const trap=rule.p&&rule.p!==rule.e?[rule.p]:[];
    const others=shuffle(base.filter(v=>v.id!==rule.id&&v.e!==rule.e&&v.e!==rule.p)).slice(0,3-trap.length).map(v=>v.e);
    return {rule,kind:"voc",dir,opts:shuffle([rule.e,...trap,...others]),ans:rule.e,done:false};
  }
