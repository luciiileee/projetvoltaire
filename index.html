      <span class="lvtop"><span class="lvnum">${li+1}</span>${sug?`<span class="st sg">Suggéré</span>`:""}${chip}</span>
      <span class="lvnm">${esc(l.name.replace(/^\d+\.\s*/,""))}</span><span class="lvsb">${esc(l.sub)}</span>
      <span class="lvft"><span class="lvbar2"><i style="width:${p}%"></i></span><span class="lvct">${x.mas}/${x.tot}${er?` · ${er} à revoir`:""}</span></span></button>`;}).join("");
  return plainBar()+`<main class="wrap page withbottom"><div class="head"><button class="back" data-act="home" aria-label="Retour">←</button><div><h1>${M.name}</h1><div class="sub">${M.kick}</div></div></div>
  ${tabs}<div class="lvgrid">${items}</div>
  <div class="row">
    <button class="btn pri" data-act="review" data-m="${m}" ${er?"":"disabled"}>Ancrage mémoriel${er?` (${Math.min(er,24)})`:""}</button>
    <button class="btn" data-act="rules" data-m="${m}">Règles par thème</button>
  </div></main>
  <footer class="bottombar"><div class="wrap bb"><div class="mark" style="display:block">Graphie<b>.</b></div><div class="tt"><span>Temps total</span><b>${fmtTime(S[m].sec)}</b></div><button class="exit" data-act="home">Sortir</button></div></footer>`;
}
function rulesPage(m,f){
  const M=MODS[m];
  const keep=r=>{const s=S[m].r[r.id];if(f==="m")return s&&s.m;if(f==="e")return s&&s.e>0;if(f==="r")return toRework(m,r.id)||isDue(m,r.id);if(f==="n")return !s||!s.n;return true;};
  const ex=r=>r.type==="tap"?esc(tokens(parse(r.items[0]),"r").map(t=>t.t).join(" ")):r.type==="qcm"?esc(r.items[0][1][0]):esc(r.x);
  let count=0,html="";
  M.tracks.forEach((t,ti)=>{
    let part="";
    t.levels.forEach((l,li)=>{const list=l.rules.filter(keep);if(!list.length)return;count+=list.length;const x=lvStat(m,ti,li);
      part+=`<section class="grp"><div class="grph"><div class="gt"><span class="nm">${esc(l.name)} · ${pct(x.mas,x.tot)} %</span><span class="sb">${esc(l.sub)}</span></div>
        <div class="row"><button class="btn pri" data-act="level" data-m="${m}" data-ti="${ti}" data-li="${li}">S'entraîner</button>${list.length>1&&list.some(r=>S[m].r[r.id]&&S[m].r[r.id].e)?`<button class="btn" data-act="focusgrp" data-m="${m}" data-ti="${ti}" data-li="${li}">Mes erreurs du thème</button>`:""}</div></div>
        <div class="rl">${list.map(r=>{const s=S[m].r[r.id];const cls=s&&s.m?"m":s&&s.e?"e":"";const st=toRework(m,r.id)?"à retravailler":isDue(m,r.id)?"à revoir":s&&s.m?"acquise":s&&s.n?"en cours":"";
          return `<details class="ri"><summary><i class="dot ${cls}"></i><span>${esc(cap(r.t))}</span><small>${st}${s&&s.e?` · ${s.e} err.`:""}</small></summary><p>${esc(r.e)}</p><div class="exs">${ex(r)}</div><button class="linkbtn" data-act="focus" data-m="${m}" data-id="${esc(r.id)}">Retravailler cette ${r.type==="voc"?"notion":"règle"} →</button></details>`;}).join("")}</div></section>`;});
    if(part)html+=(M.tracks.length>1?`<h2 class="trk">${esc(t.name)}</h2>`:"")+part;
  });
  return plainBar()+`<main class="wrap page"><div class="head"><button class="back" data-act="mod" data-m="${m}" aria-label="Retour">←</button><div><h1>Règles par thème</h1><div class="sub">${MODS[m].name} · ${count} affichées</div></div></div>
  <div class="filters">${[["all","Toutes"],["r","À revoir"],["e","Avec erreurs"],["m","Acquises"],["n","Pas encore vues"]].map(([k,l])=>`<button class="${f===k?"on":""}" data-act="rf" data-m="${m}" data-f="${k}">${l}</button>`).join("")}</div>
  ${html||`<p class="foot">Rien à afficher pour ce filtre.</p>`}</main>`;
}

function playBar(){
  const M=MODS[ses.m];
  const left=remaining().length,total=ses.pool.length;
  const label=ses.mode==="review"?"Ancrage mémoriel":ses.mode==="focus"?(ses.label||"Révision ciblée"):M.tracks[ses.ti].levels[ses.li].name;
  const st=ses.pool.map(r=>`<i class="${doneRule(r)?"on":""}"></i>`).join("");
  return `<header class="topbar"><div class="wrap tb">
    <div class="mark">Graphie<b>.</b></div>
    <div class="lvwrap"><span>${esc(label)}</span><div class="lvbar"><i style="width:${pct(total-left,total)}%"></i></div></div>
    <div class="stars" aria-label="${total-left} sur ${total} acquises">${st}</div>
    <button class="exit" data-act="quit">Sortir</button></div></header>`;
}
function banner(c){
  if(!c.done){
    if(c.stage==="write")return `<div class="banner neutral"><div class="wrap"><p class="tag good">Bien repéré ! Écris maintenant la bonne forme.</p></div></div>`;
    if(c.tag)return `<div class="banner neutral"><div class="wrap"><p class="tag">${esc(c.tag)}</p></div></div>`;
    const ins=c.kind==="ref"?"Choisis la reformulation la plus proche des passages en gras.":c.kind==="tap"?"":c.kind==="voc"?(c.dir==="dw"?(c.rule.g==="rac"?"Quel préfixe ou quelle racine a ce sens ?":"Quel mot correspond à cette définition ?"):c.rule.g==="rac"?"Que signifie ce préfixe ou cette racine ?":"Touche le mot ou le groupe de mots dont le sens est le plus proche."):"Choisis la bonne réponse.";
    return ins?`<div class="banner neutral"><div class="wrap"><p>${ins}</p></div></div>`:`<div class="banner neutral"></div>`;
  }
  const big=c.ok?"Bien vu !":"Pas tout à fait";
  const sub=c.kind==="tap"?(c.typed!=null?(c.ok?"Faute repérée et bien corrigée.":"Faute bien repérée, mais la correction n'est pas la bonne."):c.showErr?"Il y a une faute.":"Il n'y a pas de faute."):(c.ok?"Il s'agit de la bonne réponse.":"La bonne réponse était ailleurs.");
  return `<div class="banner ${c.ok?"ok":"bad"}" role="status"><div class="wrap"><strong>${big}</strong><span>${sub}</span></div></div>`;
}
function anchor(c){if(c.dir){const st=S[ses.m].r[c.rule.id]||{};const n=need(c.rule,st);const ck=k=>(st[k]||0)>=n||st.m;
  return `<div class="anchor"><span class="dirs"><i class="${ck("wd")?"on":""}"></i>Mot → définition <i class="${ck("dw")?"on":""}"></i>Définition → mot</span><span>${c.justM?"Acquis dans les deux sens : rappel dans "+IV[st.k]+" jour"+(IV[st.k]>1?"s":""):st.m?"Acquis":c.done&&!c.ok?"Ce mot reviendra dans quelques questions":"À valider dans les deux sens"}</span></div>`;}const st=S[ses.m].r[c.rule.id]||{s:0,e:0};const n=need(c.rule,st);let h="";for(let i=0;i<n;i++)h+=`<i class="${i<Math.min(st.s,n)?"on":""}"></i>`;return `<div class="anchor">${h}<span>${c.justM?"Notion acquise : rappel dans "+IV[st.k]+" jour"+(IV[st.k]>1?"s":""):st.m?"Acquise":c.done&&!c.ok?"Cette notion reviendra dans quelques questions":"Bonnes réponses d'affilée"}</span></div>`;}
const nextRow=c=>`<div class="nextrow">${anchor(c)}<button class="nextbtn" data-act="next" id="nextbtn">Suivant</button></div>`;

function playPage(){
  const c=ses.cur;let body="";
  if(c.kind==="tap"){
    body=`<p class="sent">${c.toks.map((t,i)=>{let cls="w";if(c.done){if(c.showErr&&t.err)cls+=" err";if(c.tap===i)cls+=(c.ok||c.typed!=null)?" hit-ok":" hit-bad";}else if(c.stage==="write"&&t.err)cls+=" picked";
      return `<span class="${cls}" ${c.done?"":`data-act="tap" data-i="${i}" role="button" tabindex="0"`}>${esc(t.t)}</span>`;}).join(" ")}</p>`;
    const advT=`<label class="adv"><input type="checkbox" id="advtoggle" data-act="adv" ${S[ses.m].adv?"checked":""}><span class="sw" aria-hidden="true"></span><span><b>Mode avancé</b> : après avoir repéré la faute, tu écris la correction</span></label>`;
    if(!c.done&&c.stage==="write"){const pt=c.parts.find(p=>p.err);
      body+=`<div class="fixbox"><label for="fixin">Corrige « <b>${esc(pt.w)}</b> » :</label><input id="fixin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Écris la bonne forme">
      <div class="row"><button class="btn pri" data-act="write">Valider</button><button class="btn" data-act="giveup">Je ne sais pas</button></div></div>`+advT;}
    else if(!c.done)body+=`<button class="nofault" data-act="nofault">Il n'y a pas de faute</button><p class="hint">Si tu vois une faute, touche-la. Sinon, touche ce bouton.</p>`+advT;
    else{
      if(c.typed!=null&&!c.ok)body+=`<p class="typed">Ta correction : <s>${esc(c.typed||"(aucune)")}</s></p>`;
      body+=`<div class="rulehead"><h3>${esc(c.rule.t)}</h3></div><p class="ruletxt">${esc(c.rule.e)}</p><hr class="sep">`;
      if(c.showErr)body+=`<p class="correct-lab">La phrase correcte est :</p><p class="correct">${tokens(c.parts,"r").map(t=>t.err?`<b>${esc(t.t)}</b>`:esc(t.t)).join(" ")}</p>`;
      else if(c.canErr)body+=`<p class="trap">Le piège aurait été d'écrire « ${esc(errText(c.parts,"w"))} ».</p>`;
      body+=nextRow(c);
    }
  }else if(c.kind==="ref"){
    body=`<p class="refs">${esc(c.rule.s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}</p>
    <div class="reflist">${c.opts.map((o,i)=>{let cls="tile refopt";if(c.done){if(o===c.ans)cls+=" ok";else if(c.pick===i)cls+=" bad";}
      return `<button class="${cls}" ${c.done?"disabled":`data-act="pick" data-i="${i}"`}><span class="lt">${"ABCDE"[i]}</span><span>${esc(o)}</span></button>`;}).join("")}</div>`;
    if(c.done){const pa=c.ans.split(" / ");body+=`<div class="others"><b>Correspondances</b>${c.rule.bold.map((b,i)=>`<p><span>${esc(b)}</span> ≈ ${esc(pa[i]||"")}</p>`).join("")}</div>`+nextRow(c);}
  }else if(c.kind==="voc"&&c.dir==="dw"){
    body=`<p class="defq">${esc(cap(c.rule.e))}</p>
    <div class="grid">${c.opts.map((o,i)=>{let cls="tile wordtile";if(c.done){if(o===c.ans)cls+=" ok";else if(c.pick===i)cls+=" bad";}
      return `<button class="${cls}" ${c.done?"disabled":`data-act="pick" data-i="${i}"`}>${esc(cap(o))}</button>`;}).join("")}</div>`;
    if(c.done)body+=`<div class="example"><div class="book">${BOOK}</div><h4>${esc(cap(c.rule.t))}</h4><p>${esc(c.rule.x)}</p></div>
      <div class="others"><b>Les autres propositions</b>${c.dis.map(v=>`<p><span>${esc(cap(v.t))}</span> : ${esc(v.e)}</p>`).join("")}</div>`+nextRow(c);
  }else if(c.kind==="voc"){
    body=`<p class="word">${esc(cap(c.rule.t))}</p>
    <div class="grid">${c.opts.map((o,i)=>{let cls="tile";if(c.done){if(o===c.ans)cls+=" ok";else if(c.pick===i)cls+=" bad";}
      return `<button class="${cls}" ${c.done?"disabled":`data-act="pick" data-i="${i}"`}>${esc(cap(o))}</button>`;}).join("")}</div>`;
    if(c.done)body+=`<div class="example"><div class="book">${BOOK}</div><h4>${esc(cap(c.rule.t))}</h4><p>${esc(c.rule.x)}</p></div>`+nextRow(c);
  }else{
    body=`<p class="word" style="font-weight:500">${esc(c.q)}</p>
    <div class="grid ${c.opts.some(o=>o.length>28)?"list":""}">${c.opts.map((o,i)=>{let cls="tile";if(c.done){if(o===c.ans)cls+=" ok";else if(c.pick===i)cls+=" bad";}
      return `<button class="${cls}" ${c.done?"disabled":`data-act="pick" data-i="${i}"`}>${esc(o)}</button>`;}).join("")}</div>`;
    if(c.done)body+=`<div class="rulehead"><h3>${esc(c.rule.t)}</h3></div><p class="ruletxt">${esc(c.rule.e)}</p>`+nextRow(c);
  }
  return playBar()+banner(c)+`<main class="wrap ex ${c.done?"answered":""}">${body}</main>`;
}
function donePage(){
  const m=ses.m,M=MODS[m];
  if(ses.mode!=="level")return plainBar()+`<div class="banner ok"><div class="wrap"><strong>Bravo !</strong><span>${ses.mode==="focus"?"Notion acquise.":"Révision terminée."}</span></div></div><main class="wrap page"><p>${ses.n} questions, ${pct(ses.ok,ses.n)} % de bonnes réponses. Chaque notion revue est de nouveau acquise ; elle reviendra en rappel dans quelques jours pour l'ancrer.</p>
   <div class="row"><button class="btn pri" data-act="mod" data-m="${m}">Retour au module</button><button class="btn" data-act="home">Accueil</button></div></main>`;
  const T=M.tracks[ses.ti],L=T.levels,nextLi=ses.li+1<L.length?ses.li+1:null;
  return plainBar()+`<div class="banner ok"><div class="wrap"><strong>Bravo !</strong><span>${esc(L[ses.li].name)} : 100 %</span></div></div><main class="wrap page">
   <p>${M.tracks.length>1?esc(T.name)+" · ":""}${L[ses.li].rules.length} notions acquises.${ses.n?` Sur cette séance : ${ses.n} questions, ${pct(ses.ok,ses.n)} % justes.`:""}</p>
   <div class="row">${nextLi!=null?`<button class="btn pri" data-act="level" data-m="${m}" data-ti="${ses.ti}" data-li="${nextLi}">${esc(L[nextLi].name)}</button>`:""}<button class="btn" data-act="mod" data-m="${m}">Retour au module</button></div></main>`;
}
let saveMsg={},confirmKey=null;
function exportCode(){try{return btoa(unescape(encodeURIComponent(JSON.stringify({app:"graphie",v:1,at:Date.now(),S}))));}catch(e){return "";}}
function savesPage(){
  const fmtD=u=>u?new Date(u).toLocaleDateString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"jamais";
  return plainBar()+`<main class="wrap page"><div class="head"><button class="back" data-act="home" aria-label="Retour">←</button><div><h1>Sauvegardes</h1><div class="sub">${SYNC==="cloud"?"Progression enregistrée sur ton compte et sur cet appareil.":"Progression enregistrée sur cet appareil. Garde un code de secours ci-dessous."}</div></div></div>
  ${ORDER.map(m=>{const st=modStat(m);return `<div class="box"><h3>${MODS[m].name}</h3><p>${st.mas}/${st.tot} acquises · ${S[m].q} réponses · ${fmtTime(S[m].sec)} · dernière activité : ${fmtD(S[m].u)}</p>
    ${confirmKey==="reset-"+m?`<div class="confirm">Effacer toute la progression de ce module ? <button class="btn danger" data-act="doreset" data-m="${m}">Oui, effacer</button><button class="btn" data-act="cancel">Annuler</button></div>`:`<div><button class="linkbtn" data-act="askreset" data-m="${m}">Réinitialiser ce module</button></div>`}</div>`;}).join("")}
  <div class="box"><h3>Code de sauvegarde</h3><p>Copie ce code dans tes notes : il contient les trois modules et permet de tout restaurer sur un autre appareil.</p>
   <textarea id="exp" readonly>${esc(exportCode())}</textarea>
   <div class="row"><button class="btn" data-act="copy">Copier le code</button><span class="msg ok">${saveMsg.copy||""}</span></div></div>
  <div class="box"><h3>Restaurer depuis un code</h3><textarea id="imp" placeholder="Colle ici un code de sauvegarde"></textarea>
   ${confirmKey==="import"?`<div class="confirm">Remplacer la progression actuelle par celle du code ? <button class="btn danger" data-act="doimport">Oui, restaurer</button><button class="btn" data-act="cancel">Annuler</button></div>`:`<div class="row"><button class="btn" data-act="askimport">Restaurer</button><span class="msg ${saveMsg.impOk?"ok":"bad"}">${saveMsg.imp||""}</span></div>`}</div></main>`;
}

/* ===================== INTERACTIONS ===================== */
let pendingImport="";
function answered(){render();window.scrollTo(0,0);}
app.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,m=el.dataset.m;
  if(a==="home")go({name:"home"});
  else if(a==="mod")go({name:"mod",m,ti:el.dataset.ti!=null?+el.dataset.ti:(ses&&ses.m===m&&ses.ti!=null?ses.ti:null)});
  else if(a==="tab"){view.ti=+el.dataset.ti;render();}
  else if(a==="toggleul"){S[m].ul=!S[m].ul;persist(m);render();}
  else if(a==="rules")go({name:"rules",m});
  else if(a==="rf"){view.f=el.dataset.f;render();}
  else if(a==="saves"){saveMsg={};confirmKey=null;go({name:"saves"});}
  else if(a==="resume"){const ti=(S[m].last&&S[m].last.ti)||0;startLevel(m,ti,curLevel(m,ti));}
  else if(a==="level")startLevel(m,+el.dataset.ti,+el.dataset.li);
  else if(a==="review")startReview(m);
  else if(a==="focus")startFocus(m,[el.dataset.id],"Révision ciblée");
  else if(a==="focusgrp"){const l=MODS[m].tracks[+el.dataset.ti].levels[+el.dataset.li];startFocus(m,l.rules.filter(r=>S[m].r[r.id]&&S[m].r[r.id].e).map(r=>r.id),l.name+" · erreurs");}
  else if(a==="quit")go({name:"mod",m:ses.m,ti:ses.ti!=null?ses.ti:null});
  else if(a==="tap"){const c=ses.cur;if(c.done||c.stage==="write")return;const i=+el.dataset.i;c.tap=i;
    if(S[ses.m].adv&&c.showErr&&c.toks[i].err){c.stage="write";render();const f=document.getElementById("fixin");if(f)f.focus();return;}
    record(c.showErr&&c.toks[i].err);answered();}
  else if(a==="adv"){S[ses.m].adv=el.checked;persist(ses.m);}
  else if(a==="write"||a==="giveup"){const c=ses.cur;if(c.done||c.stage!=="write")return;const pt=c.parts.find(p=>p.err);
    const v=a==="giveup"?"":(document.getElementById("fixin")||{}).value||"";c.typed=v;c.stage=null;record(a==="write"&&fixOk(v,pt));answered();}
  else if(a==="nofault"){const c=ses.cur;if(c.done)return;c.tap=null;record(!c.showErr);answered();}
  else if(a==="pick"){const c=ses.cur;if(c.done)return;const i=+el.dataset.i;c.pick=i;record(c.opts[i]===c.ans);answered();}
  else if(a==="next")cont();
  else if(a==="askreset"){confirmKey="reset-"+m;render();}
  else if(a==="cancel"){confirmKey=null;render();}
  else if(a==="doreset"){S[m]=blank();persist(m);confirmKey=null;render();}
  else if(a==="copy"){const ta=document.getElementById("exp");
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(()=>{saveMsg.copy="Copié";render();}).catch(()=>{ta.focus();ta.select();});}
    else{ta.focus();ta.select();}}
  else if(a==="askimport"){pendingImport=document.getElementById("imp").value.trim();
    try{const o=JSON.parse(decodeURIComponent(escape(atob(pendingImport))));if(!o||o.app!=="graphie"||!o.S)throw 0;confirmKey="import";saveMsg={};render();document.getElementById("imp").value=pendingImport;}
    catch(err){saveMsg={imp:"Ce code n'est pas reconnu. Vérifie qu'il est complet.",impOk:false};render();}}
  else if(a==="doimport"){try{const o=JSON.parse(decodeURIComponent(escape(atob(pendingImport))));ORDER.forEach(k=>{S[k]=norm(o.S[k]);persist(k);});confirmKey=null;saveMsg={imp:"Progression restaurée.",impOk:true};render();}catch(err){confirmKey=null;saveMsg={imp:"La restauration a échoué.",impOk:false};render();}}
});
const nz=s=>s.trim().replace(/\s+/g," ").replace(/[’ʼ]/g,"'");
const lf=s=>s.charAt(0).toLowerCase()+s.slice(1);
function fixOk(v,pt){const x=nz(v),r=nz(pt.r),w=nz(pt.w);if(!x)return false;if(x===r)return true;return lf(w)!==lf(r)&&lf(x)===lf(r);}
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="fixin"){e.preventDefault();e.stopPropagation();const b=document.querySelector('[data-act="write"]');if(b)b.click();return;}});
app.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("w")){e.preventDefault();e.target.click();}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&view.name==="play"&&ses&&ses.cur&&ses.cur.done&&!(e.target.closest&&e.target.closest("button"))){e.preventDefault();cont();}});

loadLocal();render();initCloud();
</script>
